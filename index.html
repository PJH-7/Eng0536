<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0b11">
<title>이미지 생성기</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎨</text></svg>">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0b11; --card:#12141d; --line:#2a3040; --line2:#343c50;
  --ink:#e8ecf5; --sub:#98a4bd; --dim:#5f6a80;
  --accent:#6fa8dc; --accent2:#c98fd0; --gold:#d4a862;
  --field:#080a10;
}
html,body{margin:0}
body{padding:14px 12px calc(88px + env(safe-area-inset-bottom));
  max-width:560px;margin:0 auto;background:var(--bg);color:var(--ink);
  font-family:'Pretendard','Apple SD Gothic Neo',-apple-system,'Roboto',sans-serif;
  font-size:15px;-webkit-text-size-adjust:100%;line-height:1.5}

.head{text-align:center;margin-bottom:14px}
.head .tag{font-size:11px;color:var(--accent);font-weight:700;letter-spacing:.14em;margin-bottom:5px}
.head h1{font-size:23px;font-weight:900;margin:0;
  background:linear-gradient(120deg,#6fa8dc,#c98fd0,#d4a862);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.head p{font-size:12.5px;color:var(--sub);margin:6px 0 0;line-height:1.55}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card-t{font-size:14px;font-weight:800;color:var(--sub);margin-bottom:11px;
  display:flex;justify-content:space-between;align-items:center}
.card-t .sub{font-size:11px;font-weight:400;color:var(--dim)}

/* 프리셋 */
.preset{display:flex;flex-wrap:wrap;gap:8px}
.pchip{background:var(--field);border:1px solid var(--line2);border-radius:20px;
  padding:10px 15px;font-size:14px;color:var(--sub);cursor:pointer;font-weight:600;
  min-height:42px;display:flex;align-items:center}
.pchip:active,.pchip.on{border-color:var(--accent);color:var(--accent);background:#0f1626}

/* 열 이름 정의 */
.cols{display:flex;flex-wrap:wrap;gap:7px}
.cols input{flex:1;min-width:96px;background:var(--field);border:1px solid var(--line2);
  border-radius:9px;color:#8fb4e8;font-size:13.5px;font-weight:700;text-align:center;
  padding:10px 6px;font-family:inherit;outline:none;min-height:44px}
.cols input:focus{border-color:var(--accent)}

/* 행 카드 (아코디언) */
.rowcard{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden;background:#0e1017}
.rowcard.common{border-color:#2d4a6a;background:#0c1424}
.rowhead{display:flex;align-items:center;gap:9px;padding:13px 14px;cursor:pointer;user-select:none}
.rowhead .badge{font-size:13px;font-weight:800;color:var(--accent);
  background:#0f1a2e;border:1px solid #2d4a6a;border-radius:8px;padding:4px 11px;white-space:nowrap}
.rowcard.common .rowhead .badge{color:var(--gold);border-color:#4a3a1e;background:#1e1810}
.rowhead .peek{flex:1;font-size:12.5px;color:var(--dim);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.rowhead .arw{color:var(--dim);font-size:13px;transition:transform .2s}
.rowcard.open .rowhead .arw{transform:rotate(180deg)}
.rowbody{display:none;padding:2px 12px 12px}
.rowcard.open .rowbody{display:block}

.field{margin-bottom:10px}
.field:last-child{margin-bottom:2px}
.field label{display:block;font-size:12px;color:var(--sub);font-weight:700;margin-bottom:5px}
.field textarea{width:100%;min-height:56px;background:var(--field);border:1px solid var(--line2);
  border-radius:9px;color:var(--ink);font-size:14.5px;padding:11px;font-family:inherit;
  line-height:1.55;resize:vertical;outline:none}
.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px #6fa8dc33}
.field textarea.pick{border-color:var(--gold);box-shadow:0 0 0 2px #d4a86244}
.field .ph{font-size:11px;color:var(--dim);margin-top:4px}

.rowtools{display:flex;gap:9px;margin-top:6px}
.rowtools button{flex:1;background:#161a26;border:1px solid var(--line2);color:var(--sub);
  border-radius:10px;padding:12px;font-size:14px;font-family:inherit;cursor:pointer;
  min-height:46px;font-weight:600}
.rowtools button:active{background:#1c2233}
.rowcnt{text-align:center;font-size:12px;color:var(--dim);margin-top:8px}

/* 이미지 슬롯 */
.slots{display:flex;gap:10px}
.slot{flex:1;aspect-ratio:1;background:var(--field);border:1.5px dashed var(--line2);
  border-radius:11px;display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;cursor:pointer}
.slot span{font-size:12px;color:var(--dim);text-align:center;padding:4px;line-height:1.4}
.slot img{width:100%;height:100%;object-fit:cover}
.slot .x{position:absolute;top:5px;right:5px;background:#000b;color:#fff;border:0;
  width:26px;height:26px;border-radius:50%;font-size:15px;cursor:pointer;display:none}
.slot.has .x{display:flex;align-items:center;justify-content:center}
.slot.has{border-style:solid;border-color:#3a4560}

textarea.suffix{width:100%;background:var(--field);border:1px solid var(--line2);border-radius:10px;
  color:var(--ink);font-size:14px;padding:11px;font-family:inherit;line-height:1.6;outline:none;min-height:64px}
textarea.suffix:focus{border-color:var(--accent)}
.hint{font-size:11.5px;color:var(--dim);margin-top:7px;line-height:1.6}

button.sec{width:100%;background:#161a26;color:var(--sub);font-size:14px;padding:14px;
  font-weight:600;margin-top:10px;border:1px solid var(--line2);border-radius:11px;
  font-family:inherit;cursor:pointer;min-height:50px}

#preview{margin-top:10px;font-size:12.5px;color:var(--sub);line-height:1.75;
  background:var(--field);border:1px solid var(--line);border-radius:11px;padding:12px;
  white-space:pre-wrap;max-height:220px;overflow-y:auto;display:none}
#preview.on{display:block}
#preview b{color:#8fb4e8}

#msg{display:none;margin-top:12px;padding:13px;border-radius:11px;font-size:14px;line-height:1.7;white-space:pre-wrap}
#msg.ok{display:block;background:#0f2018;border:1px solid #2d6a4a;color:#7fd4a4}
#msg.err{display:block;background:#22110f;border:1px solid #6a3630;color:#e08a7a}
#msg.wait{display:block;background:#101828;border:1px solid #2d4a6a;color:#7fb0d4}

/* 하단 고정 생성 바 */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:linear-gradient(180deg,#0a0b11cc,#0a0b11);
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);backdrop-filter:blur(8px)}
.dock-in{max-width:560px;margin:0 auto;display:flex;gap:10px;align-items:center}
.dock .info{font-size:11.5px;color:var(--dim);white-space:nowrap;line-height:1.35}
.dock .info b{color:var(--accent);font-size:14px}
.dock button{flex:1;padding:16px;border:0;border-radius:12px;
  background:linear-gradient(120deg,#5a7fd0,#8f6fc0);color:#fff;
  font-size:16px;font-weight:800;font-family:inherit;cursor:pointer;min-height:54px}
.dock button:disabled{opacity:.45}

.foot{text-align:center;margin-top:6px;font-size:11px;color:#3f475a;line-height:1.7}

#_toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));
  transform:translateX(-50%);background:#1a2740;color:#8fb4e8;border:1px solid #2d4a6a;
  border-radius:22px;padding:11px 18px;font-size:13px;z-index:999;opacity:0;
  transition:opacity .2s;box-shadow:0 4px 18px #000a;max-width:90%;text-align:center;pointer-events:none}
</style>
</head>
<body>

<div class="head">
  <div class="tag">MATRIX PROMPT · GPT-IMAGE-1</div>
  <h1>이미지 생성기</h1>
  <p>요소별로 나눠 5개까지 · 참고 이미지 3개</p>
</div>

<!-- 프리셋 -->
<div class="card">
  <div class="card-t">프리셋 <span class="sub">칸을 탭한 뒤 선택</span></div>
  <div class="preset" id="presets"></div>
</div>

<!-- 열 이름 -->
<div class="card">
  <div class="card-t">요소 이름 <span class="sub">칸 제목 · 수정 가능</span></div>
  <div class="cols" id="cols"></div>
</div>

<!-- 행 카드들 -->
<div class="card">
  <div class="card-t">프롬프트 입력 <span class="sub">행을 탭하면 펼쳐짐</span></div>
  <div id="rows"></div>
  <div class="rowtools">
    <button id="rmRow">− 행 줄이기</button>
    <button id="addRow">+ 행 늘리기</button>
  </div>
  <div class="rowcnt" id="rowcnt"></div>
</div>

<!-- 이미지 슬롯 -->
<div class="card">
  <div class="card-t">참고 이미지 <span class="sub">최대 3개 · 공통</span></div>
  <div class="slots" id="slots"></div>
  <p class="hint">넣으면 그 스타일·구도를 참고합니다. 없으면 프롬프트만으로 생성합니다.</p>
</div>

<!-- 공통 접미 -->
<div class="card">
  <div class="card-t">공통 접미 규격 <span class="sub">모든 프롬프트 끝에 붙음</span></div>
  <textarea class="suffix" id="suffix">photorealistic, 8K, 9:16 vertical, accurate white balance, no green or teal color cast</textarea>
  <p class="hint">애니로 바꾸려면 photorealistic을 지우세요</p>
</div>

<button class="sec" id="prev">완성 프롬프트 미리보기</button>
<div id="preview"></div>
<div id="msg"></div>
<div class="foot">요청 후 텔레그램으로 순차 전송 · 5장 약 5분</div>

<!-- 하단 고정 -->
<div class="dock">
  <div class="dock-in">
    <div class="info"><b id="dcnt">0</b>장<br><span id="dcost">$0.00</span></div>
    <button id="go">이미지 생성 요청</button>
  </div>
</div>

<script>
const WEBHOOK_URL = 'https://engineer0536.app.n8n.cloud/webhook/make-bg';
const COST = 0.17;
let COLS = ['인물 외모','행동·표정','배경','화풍','기타'];
let ROWS = 5;
const MAXROWS = 5, MINROWS = 1;

const PRESETS = {
  '실사':'photorealistic, hyperrealistic, DSLR photograph, natural lighting',
  '애니':'anime style, cel shaded, clean lineart, vibrant colors',
  '수채화':'watercolor painting, soft washes, delicate brush strokes',
  '유화':'oil painting, rich textured brushwork, classical style',
  '버드뷰':"aerial view, bird's eye view, top-down angle",
  '사선뷰':'three-quarter angle view, dynamic diagonal composition',
  '눈높이':'eye-level shot, camera at 150cm, horizontal angle',
  '로우앵글':'low angle shot, looking up, dramatic perspective',
  '무릎샷':'knee-up shot, cropped at bottom edge, head in upper third',
  '전신':'full body shot, entire figure visible, standing',
  '클로즈업':'close-up portrait, face and shoulders, shallow depth of field',
  '회색배경':'isolated on flat solid medium gray background (#808080), empty background, no props, sharp clean edges'
};

const $ = id => document.getElementById(id);
const state = { common:{}, rows:[] };  // {colIndex:value}
for(let r=0;r<MAXROWS;r++) state.rows.push({});

let lastField = null; // 마지막 탭한 textarea

// ── 열 이름 ──
function renderCols(){
  $('cols').innerHTML = COLS.map((c,i)=>`<input value="${c}" data-col="${i}">`).join('');
  $('cols').querySelectorAll('input').forEach(inp=>{
    inp.addEventListener('input',()=>{ COLS[+inp.dataset.col]=inp.value; renderRowLabels(); });
  });
}
function renderRowLabels(){
  // 행 카드 안 라벨 갱신
  document.querySelectorAll('.field label').forEach(l=>{
    const c=+l.dataset.c; if(!isNaN(c)) l.textContent = COLS[c]||('요소'+(c+1));
  });
}

// ── 행 카드 ──
function fieldHTML(rkey, c){
  const val = (rkey==='common'?state.common:state.rows[rkey])[c] || '';
  const ph = rkey==='common' ? '공통값 (아래 빈칸에 자동 적용)' : '';
  return `<div class="field">
    <label data-c="${c}">${COLS[c]||('요소'+(c+1))}</label>
    <textarea data-r="${rkey}" data-c="${c}" placeholder="${ph}">${val}</textarea>
  </div>`;
}
function peekText(rkey){
  const obj = rkey==='common'?state.common:state.rows[rkey];
  const vals = COLS.map((_,c)=>obj[c]).filter(v=>v&&v.trim());
  return vals.join(' · ') || '비어 있음';
}
function renderRows(){
  let html = '';
  // 공통행
  html += `<div class="rowcard common" data-r="common">
    <div class="rowhead"><span class="badge">공통</span>
      <span class="peek" data-peek="common">${peekText('common')}</span>
      <span class="arw">▼</span></div>
    <div class="rowbody">${COLS.map((_,c)=>fieldHTML('common',c)).join('')}</div>
  </div>`;
  // 개별행
  for(let r=0;r<ROWS;r++){
    html += `<div class="rowcard" data-r="${r}">
      <div class="rowhead"><span class="badge">${r+1}행</span>
        <span class="peek" data-peek="${r}">${peekText(r)}</span>
        <span class="arw">▼</span></div>
      <div class="rowbody">${COLS.map((_,c)=>fieldHTML(r,c)).join('')}</div>
    </div>`;
  }
  $('rows').innerHTML = html;
  $('rowcnt').textContent = ROWS+'개 행';

  // 헤드 클릭 = 펼침/접힘
  $('rows').querySelectorAll('.rowhead').forEach(h=>{
    h.addEventListener('click',()=>h.parentElement.classList.toggle('open'));
  });
  // textarea 입력 -> state 저장 + peek 갱신
  $('rows').querySelectorAll('textarea').forEach(t=>{
    t.addEventListener('input',()=>{
      const rk=t.dataset.r, c=+t.dataset.c;
      (rk==='common'?state.common:state.rows[rk])[c]=t.value;
      const pk=$('rows').querySelector(`[data-peek="${rk}"]`);
      if(pk) pk.textContent=peekText(rk);
      updateCount();
    });
    t.addEventListener('focusin',()=>{
      lastField=t;
      $('rows').querySelectorAll('textarea.pick').forEach(x=>x.classList.remove('pick'));
      t.classList.add('pick');
    });
  });
  renderRowLabels();
}

// ── 프리셋 ──
$('presets').innerHTML = Object.keys(PRESETS).map(k=>`<span class="pchip">${k}</span>`).join('');
$('presets').querySelectorAll('.pchip').forEach(ch=>{
  ch.addEventListener('click',()=>{
    let ta = lastField;
    if(!ta){
      // 기본: 화풍(있으면) 공통, 없으면 첫 칸 공통 — 해당 행 펼치기
      const commonCard = $('rows').querySelector('.rowcard.common');
      commonCard.classList.add('open');
      const styleIdx = Math.min(3, COLS.length-1);
      ta = commonCard.querySelector(`textarea[data-r="common"][data-c="${styleIdx}"]`);
    }
    if(ta){
      // 접힌 행이면 펼치기
      ta.closest('.rowcard').classList.add('open');
      ta.value = (ta.value?ta.value+', ':'') + PRESETS[ch.textContent];
      const rk=ta.dataset.r, c=+ta.dataset.c;
      (rk==='common'?state.common:state.rows[rk])[c]=ta.value;
      const pk=$('rows').querySelector(`[data-peek="${rk}"]`); if(pk)pk.textContent=peekText(rk);
      ta.style.boxShadow='0 0 0 2px #6fa8dc'; setTimeout(()=>ta.style.boxShadow='',900);
      ta.scrollIntoView({behavior:'smooth',block:'center'});
      const rl = rk==='common'?'공통':(+rk+1)+'행';
      toast(ch.textContent+' → '+(COLS[c]||'')+'('+rl+')');
      updateCount();
    }
    ch.classList.add('on'); setTimeout(()=>ch.classList.remove('on'),400);
  });
});

// ── 행 조절 ──
$('addRow').addEventListener('click',()=>{ if(ROWS<MAXROWS){ROWS++;renderRows();updateCount();} });
$('rmRow').addEventListener('click',()=>{ if(ROWS>MINROWS){ROWS--;renderRows();updateCount();} });

// ── 이미지 슬롯 ──
const imgs=[null,null,null];
$('slots').innerHTML=[0,1,2].map(i=>
  `<div class="slot" data-i="${i}"><span>참고 ${i+1}<br>탭하여 추가</span>
   <button class="x" data-x="${i}">×</button>
   <input type="file" accept="image/*" data-f="${i}" style="display:none"></div>`).join('');
$('slots').querySelectorAll('.slot').forEach(s=>{
  const i=s.dataset.i, file=s.querySelector('input[type=file]');
  s.addEventListener('click',e=>{ if(e.target.dataset.x===undefined) file.click(); });
  file.addEventListener('change',()=>{
    const f=file.files[0]; if(!f)return;
    const rd=new FileReader();
    rd.onload=()=>{ imgs[i]=rd.result; s.classList.add('has');
      s.querySelector('span').style.display='none';
      let im=s.querySelector('img'); if(!im){im=document.createElement('img');s.insertBefore(im,s.querySelector('.x'));}
      im.src=rd.result; };
    rd.readAsDataURL(f);
  });
  s.querySelector('.x').addEventListener('click',e=>{
    e.stopPropagation(); imgs[i]=null; s.classList.remove('has');
    s.querySelector('span').style.display=''; const im=s.querySelector('img'); if(im)im.remove(); file.value='';
  });
});

// ── 프롬프트 조립 ──
function buildPrompts(){
  const suffix=$('suffix').value.trim();
  const out=[];
  for(let r=0;r<ROWS;r++){
    // 이 행에 개별값이 하나라도 있어야 활성 (공통값만으로는 행이 생기지 않음)
    const rowHasOwn = COLS.some((_,c)=>(state.rows[r][c]||'').trim());
    if(!rowHasOwn) continue;
    // 활성 행: 빈 칸은 공통값으로 채움
    const parts=[];
    for(let c=0;c<COLS.length;c++){
      const v=(state.rows[r][c]||'').trim() || (state.common[c]||'').trim();
      if(v) parts.push(v);
    }
    let p=parts.join(', ');
    if(suffix) p+=(p?', ':'')+suffix;
    if(p.trim()) out.push(p.trim());
  }
  return out;
}
// 편집용 변경분: 각 활성 행의 "개별 입력값"만 (공통 제외)
function buildChanges(){
  const out=[];
  for(let r=0;r<ROWS;r++){
    const rowHasOwn = COLS.some((_,c)=>(state.rows[r][c]||'').trim());
    if(!rowHasOwn) continue;
    // 그 행에 개별로 쓴 값들만 모음 (공통값 제외)
    const own = COLS.map((_,c)=>(state.rows[r][c]||'').trim()).filter(v=>v);
    out.push(own.join(', '));
  }
  return out;
}

function updateCount(){
  const n=buildPrompts().length;
  $('dcnt').textContent=n;
  $('dcost').textContent='$'+(n*COST).toFixed(2);
}

// ── 미리보기 ──
$('prev').addEventListener('click',()=>{
  const ps=buildPrompts(), pv=$('preview');
  pv.className='on';
  pv.innerHTML = ps.length? ps.map((p,i)=>`<b>${i+1}.</b> ${p}`).join('\n\n') : '입력된 내용이 없습니다.';
  pv.scrollIntoView({behavior:'smooth',block:'nearest'});
});

// ── 토스트 ──
let _tt;
function toast(m){
  let t=$('_toast');
  if(!t){t=document.createElement('div');t.id='_toast';document.body.appendChild(t);}
  t.textContent=m; t.style.opacity='1';
  clearTimeout(_tt); _tt=setTimeout(()=>t.style.opacity='0',1600);
}

// ── 전송 ──
function show(t,m){const e=$('msg');e.className=t;e.textContent=m;e.scrollIntoView({behavior:'smooth',block:'nearest'});}
$('go').addEventListener('click',async()=>{
  const prompts=buildPrompts();
  if(prompts.length===0) return show('err','최소 한 행 이상 입력하세요.');
  const refs=imgs.filter(x=>x);
  const btn=$('go'); btn.disabled=true; btn.textContent='전송 중...';
  show('wait','요청을 보내는 중입니다...');
  try{
    const res=await fetch(WEBHOOK_URL,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({places:prompts,refs,changes:buildChanges()})});
    if(!res.ok) throw new Error('서버 응답 '+res.status);
    const data=await res.json().catch(()=>({}));
    show('ok','✅ 접수되었습니다 ('+(data.count||prompts.length)+'장)'+
      (refs.length?('\n참고 이미지 '+refs.length+'개 적용'):'')+
      '\n\n텔레그램으로 순차 전송됩니다.\n약 '+Math.ceil(prompts.length*0.8)+'~'+prompts.length+'분 소요.');
  }catch(err){
    show('err','❌ 전송 실패\n'+err.message+'\n\n웹훅 주소와 워크플로우 활성화를 확인하세요.');
  }finally{ btn.disabled=false; btn.textContent='이미지 생성 요청'; }
});

// 초기 렌더
renderCols();
renderRows();
updateCount();
// 첫 행은 펼쳐두기
$('rows').querySelector('.rowcard.common').classList.add('open');
</script>
</body>
</html>
